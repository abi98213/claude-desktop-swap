name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test (fake Claude data folder, never a real app)
        run: python3 tests/test_cli.py
      - name: Package universal app
        run: scripts/build-app.sh "0.0.0-ci"
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeDesktopSwap
          path: dist/ClaudeDesktopSwap.zip
